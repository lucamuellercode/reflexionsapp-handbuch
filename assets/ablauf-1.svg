<svg xmlns="http://www.w3.org/2000/svg" width="700" height="774" viewBox="0 0 700 774" role="img" aria-labelledby="title desc"><title id="title">Von der Vorbereitung zum abgeschlossenen Protokoll</title><desc id="desc">Heute planen, Vorbereitung speichern, vorhandenen offenen Einsatz öffnen und Protokoll ausfüllen. Fehlende Angaben als offen speichern und später fortsetzen. Bei Vollständigkeit abgeschlossen wählen, speichern und unter Protokolle nachlesen. Bei Bedarf eine Nachverfolgung anlegen.</desc><style>rect{fill:#fff;stroke:#c6dbd5;stroke-width:1.5}text{font:16px system-ui,sans-serif;fill:#233e38}.decision rect{fill:#fff5df;stroke:#dfc077}.success rect{fill:#e4f3eb;stroke:#85b99b}</style><defs><marker id="arrow1" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#438579" stroke-width="1.6"/></marker></defs><g class=""><rect x="180" y="18" width="340" height="64" rx="12"/><text x="350" y="45" text-anchor="middle">Heute planen</text><text x="350" y="67" text-anchor="middle">Neue Vorbereitung</text></g><path d="M350 82V111" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><g class=""><rect x="180" y="116" width="340" height="64" rx="12"/><text x="350" y="154" text-anchor="middle">Vorbereitung speichern</text></g><path d="M350 180V209" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><g class=""><rect x="180" y="214" width="340" height="64" rx="12"/><text x="350" y="241" text-anchor="middle">Offene Einsätze</text><text x="350" y="263" text-anchor="middle">Vorhandenen Eintrag öffnen</text></g><path d="M350 278V307" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><g class=""><rect x="180" y="312" width="340" height="64" rx="12"/><text x="350" y="350" text-anchor="middle">Protokoll ausfüllen</text></g><path d="M350 376V405" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><g class="decision"><rect x="180" y="410" width="340" height="64" rx="12"/><text x="350" y="448" text-anchor="middle">Alle Abschlussangaben vorhanden?</text></g><path d="M250 474V512H160V531" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><path d="M450 474V531" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><g class=""><rect x="20" y="536" width="280" height="76" rx="12"/><text x="160" y="569" text-anchor="middle">Noch nicht: Status offen</text><text x="160" y="591" text-anchor="middle">Zwischenstand speichern</text></g><g class="success"><rect x="380" y="536" width="300" height="76" rx="12"/><text x="530" y="569" text-anchor="middle">Ja: abgeschlossen wählen</text><text x="530" y="591" text-anchor="middle">und speichern</text></g><path d="M20 574H10V246H175" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><path d="M530 612V645" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow1)"/><g class="success"><rect x="380" y="650" width="300" height="76" rx="12"/><text x="530" y="683" text-anchor="middle">Unter Protokolle nachlesen</text><text x="530" y="705" text-anchor="middle">Statistik berücksichtigt den Einsatz</text></g><text x="350" y="760" text-anchor="middle">Bei Bedarf: Neue Nachverfolgung aus dem Einsatz anlegen.</text></svg>