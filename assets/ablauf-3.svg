<svg xmlns="http://www.w3.org/2000/svg" width="700" height="468" viewBox="0 0 700 468" role="img" aria-labelledby="title desc"><title id="title">Excel-Datei per Mail anfordern</title><desc id="desc">In der Statistik Zeitraum und Unterkunft wählen, Excel per Mail bestätigen, Verarbeitung abwarten und den XLSX-Anhang im angemeldeten Postfach öffnen.</desc><style>rect{fill:#fff;stroke:#c6dbd5;stroke-width:1.5}text{font:16px system-ui,sans-serif;fill:#233e38}.decision rect{fill:#fff5df;stroke:#dfc077}.success rect{fill:#e4f3eb;stroke:#85b99b}</style><defs><marker id="arrow3" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#438579" stroke-width="1.6"/></marker></defs><g class=""><rect x="135" y="18" width="430" height="76" rx="12"/><text x="350" y="51" text-anchor="middle">Statistik</text><text x="350" y="73" text-anchor="middle">Zeitraum und Unterkunft wählen</text></g><path d="M350 94V125" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow3)"/><g class=""><rect x="135" y="130" width="430" height="76" rx="12"/><text x="350" y="163" text-anchor="middle">Excel per Mail</text><text x="350" y="185" text-anchor="middle">Unterkunft und Empfänger bestätigen</text></g><path d="M350 206V237" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow3)"/><g class=""><rect x="135" y="242" width="430" height="76" rx="12"/><text x="350" y="275" text-anchor="middle">Exportverarbeitung</text><text x="350" y="297" text-anchor="middle">Datei wird für den Auftrag erstellt</text></g><path d="M350 318V349" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow3)"/><g class="success"><rect x="135" y="354" width="430" height="76" rx="12"/><text x="350" y="387" text-anchor="middle">Postfach</text><text x="350" y="409" text-anchor="middle">Mail empfangen und XLSX öffnen</text></g></svg>