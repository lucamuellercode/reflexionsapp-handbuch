<svg xmlns="http://www.w3.org/2000/svg" width="700" height="578" viewBox="0 0 700 578" role="img" aria-labelledby="title desc"><title id="title">Ausfall erfassen und später zurücknehmen</title><desc id="desc">Vorbereitung anlegen oder öffnen, Ausgefallen wählen und Grund eintragen, speichern. Für die Rücknahme Ausfall bearbeiten, Kennzeichen zurücknehmen und zugleich Status offen wählen; danach unter Offene Einsätze fortsetzen.</desc><style>rect{fill:#fff;stroke:#c6dbd5;stroke-width:1.5}text{font:16px system-ui,sans-serif;fill:#233e38}.decision rect{fill:#fff5df;stroke:#dfc077}.success rect{fill:#e4f3eb;stroke:#85b99b}</style><defs><marker id="arrow2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#438579" stroke-width="1.6"/></marker></defs><g class=""><rect x="135" y="12" width="430" height="67" rx="12"/><text x="350" y="40.5" text-anchor="middle">Vorbereitung anlegen</text><text x="350" y="62.5" text-anchor="middle">oder vorhandene öffnen</text></g><path d="M350 79V102" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow2)"/><g class=""><rect x="135" y="107" width="430" height="67" rx="12"/><text x="350" y="135.5" text-anchor="middle">Ausgefallen wählen</text><text x="350" y="157.5" text-anchor="middle">und Ausfallgrund eintragen</text></g><path d="M350 174V197" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow2)"/><g class=""><rect x="135" y="202" width="430" height="67" rx="12"/><text x="350" y="230.5" text-anchor="middle">Speichern: vollständiger Ausfall</text><text x="350" y="252.5" text-anchor="middle">wird abgeschlossen</text></g><path d="M350 269V292" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow2)"/><g class=""><rect x="135" y="297" width="430" height="67" rx="12"/><text x="350" y="336.5" text-anchor="middle">Unter Protokolle: Ausfall bearbeiten</text></g><path d="M350 364V387" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow2)"/><g class="decision"><rect x="135" y="392" width="430" height="67" rx="12"/><text x="350" y="420.5" text-anchor="middle">Kennzeichen zurücknehmen</text><text x="350" y="442.5" text-anchor="middle">UND Status offen wählen</text></g><path d="M350 459V482" fill="none" stroke="#438579" stroke-width="2" marker-end="url(#arrow2)"/><g class=""><rect x="135" y="487" width="430" height="67" rx="12"/><text x="350" y="515.5" text-anchor="middle">Speichern und unter</text><text x="350" y="537.5" text-anchor="middle">Offene Einsätze fortsetzen</text></g></svg>